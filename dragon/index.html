<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thai-Project</title><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Thai-Project</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Jost:wght@300;400;500;600&family=Sarabun:wght@300;500&display=swap">
<style>
/* Layout: one cinematic column of illustrated plates, framed in fine gold, followed by an investor-style "carnet" of charts. Single deliberate night-and-gold theme. */
:root{
  --night:#08111e; --navy:#0e1a2b; --navy2:#13233a; --ivory:#f3ead8; --muted:#a69d8b;
  --gold:#d2ad5e; --gold-deep:#a8812a; --line:rgba(210,173,94,.38);
  --c-condo:#22a196; --c-maison:#d9694b; --c-epargne:#a8812a; --c-pilier:#8a79d6;
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Jost", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --f-thai:"Sarabun", "Thonburi", "Leelawadee UI", sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ivory)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;font-weight:300;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 60% at 50% 0%,#14243b 0%,var(--night) 60%) fixed,var(--night)}
*{box-sizing:border-box}
a{color:var(--gold)}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Gate */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(80% 60% at 50% 30%,#162a45 0%,var(--night) 70%),var(--night)}
.gate-card{width:min(420px,100%);text-align:center;display:grid;gap:18px;justify-items:center}
.gate-card svg{width:120px;height:120px}.gate-card .gate-dragon{width:min(560px,100%);height:auto;aspect-ratio:800/220;margin-bottom:-10px}.gate-card{width:min(560px,100%)!important}
.brand{font-family:var(--f-display);font-weight:500;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(28px,7vw,44px);margin:0;color:var(--ivory);padding-left:.32em}
.brand-sub{font-family:var(--f-thai);color:var(--gold);letter-spacing:.12em;margin:-8px 0 0;font-size:15px}
.gate-form{display:flex;gap:8px;width:100%}
.gate-form input{flex:1;min-width:0;background:transparent;border:1px solid var(--line);color:var(--ivory);padding:12px 14px;border-radius:2px;letter-spacing:.1em}
.gate-form input::placeholder{color:var(--muted)}
.gate-form button{background:var(--gold);color:var(--night);border:0;padding:12px 18px;border-radius:2px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;cursor:pointer}
.gate-form button:hover{background:#e3c27a}
#gate-msg{min-height:1.4em;color:#e9a08c;font-size:14px;margin:0}
.gate-hint{color:var(--muted);font-size:13px;margin:0}

/* Book */
main{max-width:980px;margin:0 auto;padding-block:40px 80px}
.cover{position:relative;border:1px solid var(--line);outline:1px solid var(--line);outline-offset:5px;margin:6px}
.cover .scene{aspect-ratio:16/10}
.cover-text{position:absolute;inset:auto 0 0 0;padding:clamp(14px,4vw,40px);display:flex;align-items:flex-end;gap:clamp(12px,3vw,28px);
  background:linear-gradient(0deg,rgba(8,17,30,.92) 0%,rgba(8,17,30,.55) 60%,transparent 100%)}
.medal{flex:none;width:clamp(64px,14vw,130px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(8,17,30,.6),0 0 0 6px var(--line)}
.medal svg{width:100%;height:100%;display:block}
.cover h1{font-family:var(--f-display);font-weight:500;margin:0;font-size:clamp(30px,7.5vw,74px);line-height:1;letter-spacing:.14em;text-transform:uppercase;text-wrap:balance}
.cover .tag{margin:6px 0 0;font-size:clamp(13px,2.2vw,18px);color:var(--ivory);opacity:.9}
.cover .tag em{font-family:var(--f-display);font-style:italic;color:var(--gold)}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0;font-weight:500}

.intro{max-width:640px;margin:56px auto 8px;text-align:center}
.intro p{margin:0;font-family:var(--f-display);font-style:italic;font-size:clamp(18px,3vw,23px);line-height:1.5;text-wrap:balance}
.rule{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--gold);margin:28px auto}
.rule::before,.rule::after{content:"";height:1px;width:80px;background:var(--line)}

.plate{margin:64px 0 0;display:grid;gap:18px}
.frame{position:relative;border:1px solid var(--line);outline:1px solid var(--line);outline-offset:5px;margin:6px;background:var(--navy)}
.scene{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bubble{position:absolute;max-width:42%;background:var(--ivory);color:#1b2233;padding:.45em .8em;border-radius:14px;
  font-family:var(--f-display);font-style:italic;font-size:clamp(10.5px,1.85vw,17px);line-height:1.3;box-shadow:0 4px 18px rgba(0,0,0,.35);text-wrap:balance}
.bubble b{font-family:var(--f-body);font-style:normal;font-weight:600;font-size:.7em;letter-spacing:.14em;text-transform:uppercase;display:block;color:var(--gold-deep)}
.bubble::after{content:"";position:absolute;bottom:-9px;left:18px;border:10px solid transparent;border-top-color:var(--ivory);border-bottom:0}
.bubble.r::after{left:auto;right:18px}
.bubble.up::after{bottom:auto;top:-9px;border-top:0;border-bottom:10px solid var(--ivory)}
.chip{position:absolute;transform:translateX(-50%);white-space:nowrap;font-size:clamp(8.5px,1.4vw,12px);letter-spacing:.12em;text-transform:uppercase;font-weight:500;
  color:var(--ivory);background:rgba(8,17,30,.72);border:1px solid var(--line);padding:.15em .6em;border-radius:20px}
.chip.gold{color:var(--night);background:var(--gold);border-color:var(--gold)}
.caption{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:baseline;padding:0 6px}
.caption .when{font-family:var(--f-display);color:var(--gold);font-size:clamp(22px,3.6vw,34px);line-height:1;grid-row:span 2;min-width:3.2em}
.caption h2{font-family:var(--f-display);font-weight:500;margin:0;font-size:clamp(20px,3.2vw,28px);line-height:1.2;text-wrap:balance}
.caption h2 .th{font-family:var(--f-thai);font-size:.6em;color:var(--gold);margin-left:.5em;font-weight:300;letter-spacing:.04em}
.caption p{margin:0;color:#d9d0bf;max-width:62ch;grid-column:2}
@media (max-width:600px){.cover-text{position:static;flex-direction:column;align-items:flex-start;background:var(--night);border-top:1px solid var(--line)}.cover h1{white-space:nowrap;font-size:clamp(26px,9vw,44px);letter-spacing:.1em}}
@media (max-width:560px){.caption{grid-template-columns:1fr}.caption .when{grid-row:auto}.caption p{grid-column:1}}

/* Carnet */
.carnet{margin-top:96px}
.carnet-head{text-align:center;display:grid;gap:10px;justify-items:center;margin-bottom:36px}
.carnet-head h2{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,5vw,46px);margin:0;letter-spacing:.04em;text-wrap:balance}
.carnet-head p{margin:0;max-width:60ch;color:#d9d0bf}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--navy);padding:18px 16px;display:grid;gap:4px;align-content:start}
.kpi .v{font-family:var(--f-display);font-size:clamp(22px,3.4vw,32px);line-height:1.1;color:var(--ivory);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);line-height:1.4}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.card{background:var(--navy);border:1px solid var(--line);padding:20px;display:grid;gap:10px;min-width:0}
.card h3{font-family:var(--f-display);font-weight:500;font-size:21px;margin:0;line-height:1.25}
.card .sub{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.card svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:#d9d0bf}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--gold);border-radius:0;width:18px}
.legend i.line{height:0;border-top:2px solid var(--ivory);border-radius:0;width:18px}
.note{font-size:13px;color:var(--muted);margin:0}
.card.wide{grid-column:1/-1}
details.table{font-size:13px;color:#d9d0bf}
details.table summary{cursor:pointer;color:var(--gold);letter-spacing:.06em}
details.table .tw{overflow-x:auto}
details.table table{border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums;width:100%}
details.table th,details.table td{border-bottom:1px solid rgba(210,173,94,.18);padding:4px 8px;text-align:right;white-space:nowrap}
details.table th:first-child,details.table td:first-child{text-align:left}
.closing{margin:72px auto 0;max-width:680px;text-align:center;display:grid;gap:14px;justify-items:center}
.closing p{margin:0;color:#d9d0bf}
.closing .sig{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--ivory)}
#music{position:fixed;z-index:57;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;background:rgba(8,17,30,.85);color:var(--ivory);border:1px solid var(--gold);border-radius:30px;padding:9px 16px;font-size:13px;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(6px)}
#music i{font-style:normal;color:var(--gold);font-size:16px}
#music.playing i{animation:glow 1.2s ease-in-out infinite}
#music:hover{background:var(--navy2)}
#yt-card{position:fixed;z-index:56;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:240px;background:var(--navy);border:1px solid var(--gold);border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.yt-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font-size:12px;letter-spacing:.06em;color:var(--gold)}
.yt-head button{background:none;border:0;color:var(--ivory);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
#yt-box{width:240px;height:135px}#yt-box iframe{width:100%;height:100%;display:block;border:0}
.gate-music{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:30px;padding:10px 20px;font-size:14px;letter-spacing:.08em;cursor:pointer}
.gate-music:hover{background:rgba(210,173,94,.12)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ivory);color:#1b2233;font-size:13px;line-height:1.4;padding:6px 10px;border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:240px;font-variant-numeric:tabular-nums}

/* Scene animation */
.sway{animation:sway 6s ease-in-out infinite;transform-box:view-box}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.waves{animation:waves 7s linear infinite}
.waves.slow{animation-duration:11s}
@keyframes waves{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.rise{animation:rise 7s ease-out both}
@keyframes rise{from{transform:translateY(46px)}to{transform:translateY(0)}}
.sink{animation:sink 14s ease-in-out infinite alternate}
@keyframes sink{from{transform:translateY(-14px)}to{transform:translateY(16px)}}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(5px) rotate(1deg)}}
.drift{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
.fly{animation:fly 18s linear infinite}
@keyframes fly{from{transform:translate(-120px,20px)}to{transform:translate(920px,-30px)}}
.train{animation:train 14s linear infinite}
@keyframes train{from{transform:translateX(-420px)}to{transform:translateX(900px)}}
.coin{animation:coin 2.4s ease-in infinite}
@keyframes coin{0%{transform:translateY(-70px);opacity:0}15%{opacity:1}80%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.lantern{animation:lantern 16s linear infinite}
@keyframes lantern{from{transform:translateY(80px)}to{transform:translateY(-420px)}}
.smoke{animation:smoke 5s ease-out infinite}
@keyframes smoke{from{transform:translateY(0) scale(.6);opacity:.7}to{transform:translateY(-60px) scale(1.6);opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%}
.scene.live .grow{animation:grow 1.6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
.twinkle{animation:glow 3s ease-in-out infinite}
.plane{animation:plane 12s ease-in-out infinite}
@keyframes plane{0%{offset-distance:0%;opacity:0}8%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
.scales{animation:scales 3s linear infinite}
@keyframes scales{to{stroke-dashoffset:-40}}
.dragon{animation:dragon 9s ease-in-out infinite}
@keyframes dragon{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-10px)}}
.scene:not(.live) svg *{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.scene svg *{animation:none!important}}
</style>

<div id="gate" role="dialog" aria-labelledby="gate-title">
  <form class="gate-card" id="gate-form" autocomplete="off">
    <svg class="gate-dragon" viewBox="0 0 800 220" aria-hidden="true" id="gate-dragon"></svg><svg viewBox="0 0 120 120" aria-hidden="true" hidden><circle cx="60" cy="60" r="56" fill="none" stroke="#d2ad5e" stroke-width="1"/><circle cx="60" cy="60" r="50" fill="none" stroke="#d2ad5e" stroke-opacity=".4" stroke-width="1"/><path d="M60 22 C76 34 84 50 60 62 C36 74 44 90 60 98" fill="none" stroke="#d2ad5e" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="22" r="4" fill="#d2ad5e"/><path d="M28 60 h64" stroke="#d2ad5e" stroke-opacity=".4"/></svg>
    <h1 class="brand" id="gate-title">Thai-Project</h1>
    <p class="brand-sub">ความฝันของครอบครัว</p>
    <div class="gate-form">
      <label for="pw" class="sr" hidden>Mot de passe</label>
      <input id="pw" type="password" placeholder="Mot de passe" aria-label="Mot de passe" autofocus>
      <button type="submit">Entrer</button>
    </div>
    <p id="gate-msg" role="status"></p>
    <button type="button" id="gate-music" class="gate-music">♪ Écouter la musique</button>
    <p class="gate-hint">Une histoire privée, à ouvrir en famille. Montez le son.</p>
  </form>
</div>

<main id="book" hidden></main>
<div id="tip" hidden></div>
<div id="yt-card" hidden><div class="yt-head"><span>♪ Sabai Sabai (instrumental) · Bird</span><button id="yt-close" type="button" aria-label="Couper la musique">×</button></div><div id="yt-box"></div></div>
<button id="music" type="button" aria-pressed="false" hidden><i aria-hidden="true">♪</i><span>Musique : off</span></button>

/* ---------- charts ---------- */
const fmt = v => Math.round(v).toLocaleString("fr-FR");
const tipEl = () => document.getElementById("tip");
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(el=>{
    const show=e=>{ const t=tipEl(); t.innerHTML=el.getAttribute("data-tip"); t.hidden=false; const x=(e.clientX ?? el.getBoundingClientRect().left), y=(e.clientY ?? el.getBoundingClientRect().top); t.style.left=Math.min(x+14, innerWidth-t.offsetWidth-8)+"px"; t.style.top=(y-t.offsetHeight-12<4? y+16 : y-t.offsetHeight-12)+"px"; };
    el.addEventListener("pointermove",show); el.addEventListener("pointerenter",show);
    el.addEventListener("pointerleave",()=>tipEl().hidden=true);
    el.setAttribute("tabindex","0"); el.addEventListener("focus",e=>{const r=el.getBoundingClientRect(); show({clientX:r.left+r.width/2,clientY:r.top});}); el.addEventListener("blur",()=>tipEl().hidden=true);
  });
}
function axisY(x0,x1,yOf,ticks,unit){ return ticks.map(t=>`<line x1="${x0}" x2="${x1}" y1="${yOf(t)}" y2="${yOf(t)}" stroke="#f3ead8" stroke-opacity=".08"/><text x="${x0-8}" y="${yOf(t)+4}" text-anchor="end" font-size="12" fill="#a69d8b">${fmt(t)}${unit}</text>`).join(""); }

function chartEpargne(F){
  const years=F.years, W=CW,H=300,L=56,R=20,T=24,B=36;
  const plan=[],pl3=[]; let a=F.start,b=F.start;
  years.forEach((y,i)=>{ if(i>0){ const add=F.saving+F.rentPerCondo*F.condosStart[i]-F.buy[i]; a+=add; b=b*(1+F.rate)+add; } plan.push(a); pl3.push(b); });
  const max=300, x=i=>L+i*(W-L-R)/(years.length-1), y=v=>T+(1-v/max)*(H-T-B);
  const line=(arr,st,dash="")=>`<path d="${arr.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join(" ")}" fill="none" stroke="${st}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:""}/>`;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Épargne disponible en fin d'année, 2026 à 2031">${axisY(L,W-R,y,[0,100,200,300]," k€")}`;
  years.forEach((yr,i)=>{ s+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="12" fill="#a69d8b">${yr}</text>`;
    if(F.buy[i]) s+=`<g><line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}" stroke="#d2ad5e" stroke-opacity=".25" stroke-dasharray="2 4"/></g>`; });
  s+=line(pl3,"#d2ad5e","6 5")+line(plan,"#f3ead8");
  plan.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#f3ead8" stroke="#0e1a2b" stroke-width="2"/>`; });
  pl3.forEach((v,i)=>{ if(i) s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#d2ad5e" stroke="#0e1a2b" stroke-width="2"/>`; });
  s+=`<text x="${x(5)-6}" y="${y(plan[5])+20}" text-anchor="end" font-size="12" fill="#f3ead8">${fmt(plan[5])} k€</text><text x="${x(5)-6}" y="${y(pl3[5])-10}" text-anchor="end" font-size="12" fill="#d2ad5e">${fmt(pl3[5])} k€</text>`;
  years.forEach((yr,i)=>{ const w=(W-L-R)/(years.length-1); s+=`<rect x="${x(i)-w/2}" y="${T}" width="${w}" height="${H-T-B}" fill="transparent" data-tip="<b>${yr}</b><br>Plan : ${fmt(plan[i])} k€<br>Placée à ${F.rate*100} % : ${fmt(pl3[i])} k€${F.buyLabel[i]?`<br>Achat : ${F.buyLabel[i]}`:""}"/>`; });
  s+="</svg>";
  const rows=years.map((yr,i)=>`<tr><td>${yr}</td><td>${fmt(plan[i])} k€</td><td>${fmt(pl3[i])} k€</td><td>${F.buyLabel[i]||"–"}</td></tr>`).join("");
  return {svg:s, table:`<table><tr><th>Fin d'année</th><th>Plan</th><th>Placée à ${F.rate*100} %</th><th>Achat</th></tr>${rows}</table>`, plan};
}
function chartPatrimoine(F, plan){
  const years=F.years, W=CW,H=300,L=56,R=20,T=24,B=36, max=500, y=v=>T+(1-v/max)*(H-T-B), step=(W-L-R)/years.length, bw=Math.min(48,step*.62);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Patrimoine en Thaïlande et épargne">${axisY(L,W-R,y,[0,100,200,300,400,500]," k€")}`;
  years.forEach((yr,i)=>{ const cx=L+step*i+step/2, immo=F.immo[i], ep=plan[i];
    const yI=y(immo), yE=y(immo+ep);
    s+=`<rect x="${cx-bw/2}" y="${yI}" width="${bw}" height="${y(0)-yI}" fill="var(--c-condo)" rx="2"/>`;
    s+=`<rect x="${cx-bw/2}" y="${yE}" width="${bw}" height="${yI-yE-2}" fill="var(--c-epargne)" rx="2"/>`;
    s+=`<text x="${cx}" y="${yE-8}" text-anchor="middle" font-size="12" fill="#f3ead8">${fmt(immo+ep)}</text>`;
    s+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="12" fill="#a69d8b">${yr}</text>`;
    s+=`<rect x="${cx-step/2}" y="${T}" width="${step}" height="${H-T-B}" fill="transparent" data-tip="<b>${yr}</b><br>Immobilier en Thaïlande : ${fmt(immo)} k€<br>Épargne : ${fmt(ep)} k€<br><b>Total : ${fmt(immo+ep)} k€</b>"/>`; });
  return s+"</svg>";
}
function chartRendement(F){
  const W=CW,H=230,L=CW<500?132:170,R=56,T=10, rowH=46, max=15, x=v=>L+v/max*(W-L-R);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rendement annuel d'un condo de Jomtien">`;
  [0,5,10,15].forEach(t=>{ s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${T+rowH*4}" stroke="#f3ead8" stroke-opacity=".08"/><text x="${x(t)}" y="${T+rowH*4+18}" text-anchor="middle" font-size="12" fill="#a69d8b">${t} %</text>`; });
  F.yields.forEach((r,i)=>{ const yy=T+i*rowH+10;
    s+=`<text x="${L-12}" y="${yy+15}" text-anchor="end" font-size="13" fill="#f3ead8">${r.label}</text>`;
    s+=`<rect x="${L}" y="${yy}" width="${x(r.v)-L}" height="22" rx="3" fill="${r.ref?'#8a79d6':'var(--c-condo)'}" opacity="${r.gross?.55:1}"/>`;
    s+=`<text x="${x(r.v)+8}" y="${yy+16}" font-size="13" fill="#f3ead8" font-weight="500">${r.v.toLocaleString("fr-FR",{maximumFractionDigits:1})} %</text>`;
    s+=`<rect x="0" y="${yy-8}" width="${W}" height="${rowH}" fill="transparent" data-tip="${r.tip}"/>`; });
  return s+"</svg>";
}
function chartRevenus(F){
  const W=CW,H=210,L=CW<500?92:110,R=20,T=34, rowH=62, max=4500, x=v=>L+v/max*(W-L-R);
  const cols={condos:"var(--c-condo)",maison:"var(--c-maison)",epargne:"var(--c-epargne)",pilier:"var(--c-pilier)"};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus mensuels à partir de 2032">`;
  s+=`<rect x="${x(F.depMin)}" y="${T-14}" width="${x(F.depMax)-x(F.depMin)}" height="${rowH*2+8}" fill="#f3ead8" opacity=".07"/><text x="${(x(F.depMin)+x(F.depMax))/2}" y="${T-20}" text-anchor="middle" font-size="12" fill="#a69d8b">Dépenses prévues : ${fmt(F.depMin)} à ${fmt(F.depMax)} €</text>`;
  [0,1000,2000,3000,4000].forEach(t=>{ s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${T-6}" y2="${T+rowH*2-10}" stroke="#f3ead8" stroke-opacity=".08"/><text x="${x(t)}" y="${H-8}" text-anchor="middle" font-size="12" fill="#a69d8b">${fmt(t)} €</text>`; });
  F.revenus.forEach((r,i)=>{ const yy=T+i*rowH; let acc=0;
    s+=`<text x="${L-12}" y="${yy+20}" text-anchor="end" font-size="13" fill="#f3ead8">${r.label}</text>`;
    r.parts.forEach(p=>{ const x0=x(acc), w=x(acc+p.v)-x0-2; s+=`<rect x="${x0}" y="${yy+4}" width="${Math.max(w,1)}" height="26" fill="${cols[p.k]}" rx="2" data-tip="<b>${p.n}</b><br>${fmt(p.v)} € par mois"/>`; acc+=p.v; });
    s+=`<text x="${x(acc)-4}" y="${yy+48}" text-anchor="end" font-size="13" fill="#f3ead8" font-weight="500">≈ ${fmt(acc)} € / mois</text>`; });
  return s+"</svg>";
}

const esc = s => String(s);
function sceneBox(name, p={}){
  const bub=(p.bubbles||[]).map(b=>`<div class="bubble ${b.side||""}" style="left:${b.x}%;top:${b.y}%">${b.who?`<b>${b.who}</b>`:""}${b.t}</div>`).join("");
  const chips=(p.chips||[]).map(c=>`<span class="chip ${c.gold?"gold":""}" style="left:${c.x}%;top:${c.y}%">${c.t}</span>`).join("");
  return `<div class="scene" data-scene="${name}"><svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${SCENES[name]()}</svg>${chips}${bub}</div>`;
}
function render(D){
  const book=document.getElementById("book");
  CW = Math.round(Math.min(620, Math.max(330, Math.min(innerWidth, 980)/(innerWidth>820?2:1) - 70)));
  let h=`<header class="cover">${sceneBox("cover",{scene:"cover"})}
    <div class="cover-text"><div class="medal" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#0e1a2b"/><circle cx="60" cy="60" r="50" fill="none" stroke="#d2ad5e" stroke-opacity=".5"/><path d="M60 20 C78 32 86 50 60 62 C34 74 42 92 60 100" fill="none" stroke="#d2ad5e" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="20" r="5" fill="#d2ad5e"/><text x="60" y="66" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="13" fill="#f3ead8" opacity=".0">มังกร</text></svg></div>
    <div><p class="eyebrow">${D.cover.eyebrow}</p><h1>Thai-Project</h1><p class="tag">${D.cover.tag}</p></div></div></header>
    <section class="intro"><p>${D.intro}</p><div class="rule" aria-hidden="true">◆</div></section>`;
  D.plates.forEach(p=>{
    h+=`<article class="plate"><div class="frame">${sceneBox(p.scene,p)}</div>
      <div class="caption"><div class="when">${p.when}</div><h2>${p.title}${p.th?`<span class="th" lang="th">${p.th}</span>`:""}</h2><p>${p.text}</p></div></article>`;
  });
  const F=D.figures, ep=chartEpargne(F);
  h+=`<section class="carnet" aria-labelledby="carnet-t"><div class="carnet-head"><p class="eyebrow">Le carnet du Dragon</p><h2 id="carnet-t">Les chiffres derrière le rêve</h2><p>${F.intro}</p></div>
    <div class="kpis">${F.kpis.map(k=>`<div class="kpi"><span class="v">${k.v}</span><span class="l">${k.l}</span></div>`).join("")}</div>
    <div class="charts">
      <div class="card"><h3>L'épargne, année après année</h3><p class="sub">Épargne disponible en fin d'année, après chaque achat (k€).</p>
        <div class="legend"><span><i class="line"></i>Plan (épargne non placée)</span><span><i class="dash"></i>Si placée à ${F.rate*100} % par an</span></div>${ep.svg}
        <details class="table"><summary>Voir le tableau</summary><div class="tw">${ep.table}</div></details></div>
      <div class="card"><h3>Le patrimoine qui grandit</h3><p class="sub">Condos au prix d'achat + épargne (k€). La maison en France n'est pas comptée.</p>
        <div class="legend"><span><i style="background:var(--c-condo)"></i>Immobilier en Thaïlande</span><span><i style="background:var(--c-epargne)"></i>Épargne</span></div>${chartPatrimoine(F,ep.plan)}</div>
      <div class="card"><h3>Ce que rapporte un condo</h3><p class="sub">Rendement annuel d'un condo acheté ${F.condoPrice} k€, comparé au taux de retrait du capital placé.</p>
        <div class="legend"><span><i style="background:var(--c-condo);opacity:.55"></i>Brut</span><span><i style="background:var(--c-condo)"></i>Net</span><span><i style="background:#8a79d6"></i>Capital placé</span></div>${chartRendement(F)}</div>
      <div class="card"><h3>Les revenus de la vie de rentier</h3><p class="sub">Revenus mensuels à partir de 2032, sans toucher au capital.</p>
        <div class="legend"><span><i style="background:var(--c-condo)"></i>5 condos</span><span><i style="background:var(--c-maison)"></i>Vente de la maison</span><span><i style="background:var(--c-epargne)"></i>Épargne restante</span><span><i style="background:var(--c-pilier)"></i>2e pilier suisse</span></div>${chartRevenus(F)}</div>
    </div>
    <div class="charts"><div class="card wide"><h3>Taux et hypothèses</h3><p class="note">${F.notes}</p></div></div>
    </section>
    <section class="closing"><div class="rule" aria-hidden="true">◆</div><p class="sig">${D.closing.sig}</p><p>${D.closing.text}</p><p class="note">Musique : un générique original, énergique, dans l'esprit des dessins animés japonais.</p></section>`;
  book.innerHTML=h;
  bindTips(book);
  const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("live",e.isIntersecting)),{rootMargin:"60px"});
  book.querySelectorAll(".scene").forEach(s=>io.observe(s));
}
