<style>
/* Webtoon vertical : une seule colonne façon téléphone, cases bord à bord, bulles en HTML par-dessus les dessins SVG animés. Look unique (pastel pop), clair. */
:root{
  --paper:#fbf7ff; --ink:#1d1b2e; --pink:#ff5fa2; --violet:#7a3cff; --sun:#ffd23f; --sky:#9ad7ff; --mute:#6b6a85;
  --f-disp:"Black Han Sans","Arial Black",Impact,sans-serif; --f-hand:"Gaegu","Comic Sans MS","Chalkboard SE",cursive; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(circle at 1px 1px, #e7dcff 1px, transparent 0);background-size:18px 18px}
[hidden]{display:none!important}
.strip{max-width:500px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 0 1px #e5dcf7,0 10px 60px #7a3cff22;padding-bottom:110px}
.panel{position:relative;border-block:3px solid var(--ink);margin:0 0 26px;background:#fff;line-height:0}
.panel svg{display:block;width:100%;height:auto}
.sfx,.disp{font-family:var(--f-disp)}
.hand{font-family:var(--f-hand);font-weight:700}
.chalk{font-family:var(--f-hand);font-weight:700}
.cover{border-top:0}
.bub{position:absolute;line-height:1.25;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:22px;padding:7px 11px 8px;
  font-family:var(--f-hand);font-weight:700;font-size:clamp(15px,4.3vw,19px);box-shadow:3px 3px 0 var(--ink);animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
.bub .who{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin-bottom:1px}
.bub::after{content:"";position:absolute;width:16px;height:16px;background:#fff;border:2.5px solid var(--ink);border-top:0;border-left:0;bottom:-9px;left:22px;transform:rotate(45deg) skew(10deg,10deg)}
.bub.br::after{left:auto;right:22px}
.bub.tl::after{bottom:auto;top:-9px;transform:rotate(225deg) skew(10deg,10deg)}
.bub.tr::after{bottom:auto;top:-9px;left:auto;right:22px;transform:rotate(225deg) skew(10deg,10deg)}
.bub.shout{border-radius:6px;background:#fff6c9;font-size:clamp(16px,4.6vw,20px)}
.bub.shout::after{background:#fff6c9}
.bub.whisper{border-style:dashed;font-size:clamp(13px,3.8vw,16px)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.narr{margin:0 18px 26px;padding:14px 16px;background:var(--ink);color:#fff;border-radius:4px;font-size:15.5px;line-height:1.55;box-shadow:4px 4px 0 var(--pink)}
.narr b{color:var(--sun)}
.ep{text-align:center;padding:30px 16px 22px}
.ep span{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--violet);padding:4px 12px;border-radius:99px}
.ep h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,9vw,42px);margin:10px 0 0;line-height:1.05;text-wrap:balance;color:var(--ink);text-shadow:3px 3px 0 var(--sun)}
.play{display:flex;align-items:center;gap:14px;width:calc(100% - 36px);margin:-6px 18px 26px;padding:12px 16px;border:3px solid var(--ink);border-radius:16px;background:var(--sun);color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.play:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.play .ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--sun);font-size:18px}
.play b{display:block;font-size:16.5px;font-weight:900}.play small{display:block;font-size:12.5px;color:#4b4a60;font-weight:700}
.play.on{background:var(--pink);color:#fff}.play.on small{color:#fff}.play.on .ic{color:var(--pink)}
.kb-wrap,.members{margin:0 18px 26px}
.kb-title{font-family:var(--f-disp);font-size:20px;margin:0 0 10px;text-align:center}
.kb{position:relative;display:flex;height:150px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--ink);gap:2px;touch-action:manipulation}
.wk{flex:1;border:0;border-radius:0 0 5px 5px;background:#fff;display:flex;align-items:flex-end;justify-content:center;padding:0 0 8px;font:800 11px var(--f-body);color:var(--mute);cursor:pointer;-webkit-tap-highlight-color:transparent}
.bk{position:absolute;top:0;width:6.4%;height:88px;border:0;border-radius:0 0 5px 5px;background:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 -6px 0 #3a3858}
.wk.hit{background:#ffd1ea}.bk.hit{background:var(--pink)}
.wk:focus-visible,.bk:focus-visible,.play:focus-visible,button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mem{display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:10px;align-items:start;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:8px;box-shadow:3px 3px 0 var(--ink)}
.mem svg{grid-row:1/3;width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.mem b{font-size:14.5px;font-weight:900;line-height:1.2}.mem small{font-size:12px;line-height:1.35;color:#4b4a60}
.card{margin:0 18px 26px;padding:16px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--violet)}
.card.gold{background:#1d1b2e;color:#fff;box-shadow:5px 5px 0 var(--sun)}
.card-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.card-top svg{flex:none;width:76px;height:76px;border-radius:50%;border:3px solid var(--ink);background:#ffe0ef}
.card.gold .card-top svg{background:#3a2d10;border-color:var(--sun)}
.card h3{font-family:var(--f-disp);font-weight:400;font-size:28px;margin:2px 0 4px}
.card p{margin:0;font-size:13.5px;line-height:1.45;color:#4b4a60}.card.gold p{color:#d9d4f2}
.lvl{font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}.card.gold .lvl{color:var(--sun)}
.stat{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;font-weight:800;padding:4px 0}
.stat i{height:12px;border:2px solid currentColor;border-radius:99px;overflow:hidden}
.stat i b{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--pink),var(--violet));animation:fill 1.6s ease-out both}
.card.gold .stat i b{background:linear-gradient(90deg,#e8a317,var(--sun))}
.stat em{font-style:normal;font-size:11.5px;color:var(--pink);white-space:nowrap}.card.gold .stat em{color:var(--sun)}
@keyframes fill{from{width:8%}}
.end{margin:10px 18px 0;padding:26px 20px;text-align:center;background:linear-gradient(160deg,#ff8fc4,#8f7bff);color:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink)}
.end p{margin:0 0 14px;font-size:16.5px;line-height:1.6}
.end .sig-k{font-family:var(--f-disp);font-size:34px;color:var(--sun);text-shadow:2px 2px 0 var(--ink)}
.end .sig{font-family:var(--f-hand);font-weight:700;font-size:26px}
.end .small{font-size:13.5px;opacity:.95;margin:0}
/* porte d'entrée */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(170deg,#ff8fc4,#8f7bff)}
.gate-box{width:100%;max-width:380px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:26px 22px;box-shadow:6px 6px 0 var(--ink);text-align:center}
.gate h1{font-family:var(--f-disp);font-weight:400;font-size:44px;margin:4px 0 0;line-height:1;text-shadow:3px 3px 0 var(--sun)}
.gate .k{font-family:var(--f-disp);color:var(--violet);font-size:18px;margin:6px 0 14px}
.gate p{margin:0 0 14px;font-size:14.5px;line-height:1.5;color:#4b4a60}
.gate input{width:100%;font:800 18px var(--f-body);padding:12px 14px;border:3px solid var(--ink);border-radius:12px;text-align:center;background:#fbf7ff;color:var(--ink)}
.gate input:focus{outline:3px solid var(--pink);outline-offset:1px}
.gate button{margin-top:12px;width:100%;font:900 18px var(--f-body);padding:13px;border:3px solid var(--ink);border-radius:12px;background:var(--pink);color:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.gate .msg{min-height:1.4em;margin:10px 0 0;font-weight:800;color:#c2185b;font-size:14px}
.gate .hint{font-size:12.5px;color:var(--mute);margin:12px 0 0}
#music{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;border:3px solid var(--ink);border-radius:99px;background:#fff;color:var(--ink);font:900 14px var(--f-body);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
#music.playing{background:var(--violet);color:#fff}
#music .eq{display:flex;gap:2px;align-items:flex-end;height:14px}#music .eq i{width:3px;height:4px;background:currentColor;border-radius:2px}
#music.playing .eq i{animation:eq .5s ease-in-out infinite alternate}#music.playing .eq i:nth-child(2){animation-delay:.15s}#music.playing .eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{to{height:14px}}
@media (prefers-reduced-motion:reduce){.bub,.stat i b{animation:none}#music.playing .eq i{animation:none;height:10px}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-box" id="gate-form" autocomplete="off">
    <h1>MAI-LAN</h1>
    <div class="k">마이란의 이야기 · le webtoon</div>
    <p>Un webtoon animé, rien que pour toi, de la part de <b>Tonton Nieu</b> 🐉</p>
    <label for="pw" class="hint" style="display:block;margin:0 0 6px">Mot de passe</label>
    <input id="pw" name="pw" type="text" inputmode="text" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="••••••••">
    <button type="submit">Ouvrir le webtoon ▶</button>
    <p class="msg" id="gate-msg" aria-live="polite"></p>
    <p class="hint">Indice : ton groupe préféré 💜 (en un mot). Monte le son !</p>
  </form>
</div>
<main class="strip" id="strip" hidden></main>
<button id="music" type="button" hidden aria-pressed="false"><span class="eq"><i></i><i></i><i></i></span><span id="music-l">Musique</span></button>

}

/* ---------- musique originale (Web Audio) ---------- */
const Music = (() => {

    chords:[[57,60,64],[57,60,65],[55,60,64],[55,59,62]], roots:[45,41,48,43],
    hook:[ [[0,76,2],[2,76,1],[3,74,1],[4,72,2],[6,74,2],[8,76,3],[12,79,2],[14,76,2]],
           [[0,81,3],[3,79,1],[4,77,2],[6,76,2],[8,72,4],[12,74,2],[14,76,2]],
           [[0,79,2],[2,76,2],[4,79,2],[6,81,2],[8,79,3],[11,76,1],[12,74,2],[14,72,2]],
           [[0,74,3],[3,76,1],[4,74,2],[6,71,2],[8,74,6],[14,67,2]] ] };

          [[0,77,2],[2,81,2],[4,84,3],[7,81,1]], [[0,86,2],[2,84,1],[3,83,1],[4,81,2],[6,77,2]], [[0,76,2],[2,80,2],[4,83,2],[6,86,2]], [[0,84,3],[3,83,1],[4,81,4]] ] };

})();
